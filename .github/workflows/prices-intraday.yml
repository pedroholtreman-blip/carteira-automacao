name: Cotações intradiárias

# Grava em price_snapshots as cotações do Yahoo Finance (e o resumo em app_settings)
# três vezes durante a sessão americana, para a app mostrar preços do dia sem
# depender da Google Sheet. Sem email, notícias ou relatório (isso é só no
# "Resumo diário da carteira", ao fecho). Os registos intradiários são
# substituídos pelo fecho definitivo às 16:37 de Nova Iorque (mesma chave ticker+data).

on:
  schedule:
    - cron: '13 15 * * 1-5'  # ~16:13 Lisboa (sessão aberta há ~45 min no verão dos EUA)
    - cron: '13 17 * * 1-5'  # ~18:13 Lisboa
    - cron: '13 19 * * 1-5'  # ~20:13 Lisboa
  workflow_dispatch: {}

jobs:
  prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Gravar cotações do dia
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          PRICES_ONLY: '1'
        run: node daily-summary.mjs
